<!doctype html>
<html lang="en" data-bs-theme="auto">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.122.0">
    <title>MMT</title>

    <!-- Bootstrap -->
    <link rel="canonical" href="https://getbootstrap.com/docs/5.3/examples/carousel/">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom styles for this template -->
    <link href="carousel.css" rel="stylesheet">

    <!-- Custom Font styles  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Roboto:wght@100..900&display=swap"
        rel="stylesheet">
    
    <style>
        /* Global Styles */
        body {
            background-color: #f4f7f6; /* Soft background color */
            font-family: 'Roboto', sans-serif;
            color: #333;
        }

        h1 {
            font-family: 'Noto Sans Thai', sans-serif;
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 50px;
            color: #333;
        }

        /* Custom Style for Images */
        .image-frame {
            border: 5px solid #ddd; /* Light gray border for the image frame */
            padding: 10px;
            margin: 20px;
            border-radius: 8px; /* Rounded corners for a smooth look */
            text-align: center;
            transition: all 0.3s ease; /* Smooth transition for hover effect */
        }

        .image-frame:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); /* Subtle shadow on hover */
            transform: translateY(-5px); /* Lift image frame on hover */
        }
        
        .image-frame img {
            max-width: 100%; /* Ensure images scale with screen size */
            height: auto;
            border-radius: 8px;
            transition: transform 0.3s ease;
        }

        .image-frame img:hover {
            transform: scale(1.05); /* Slight zoom effect on hover */
        }

        .image-label {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 40px;
        }

        .image-container .image-frame {
            width: 300px;
            margin-bottom: 30px;
        }

        /* Responsive styles */
        @media (max-width: 768px) {
            .image-container {
                display: block;
            }

            .image-container .image-frame {
                width: 100%;
                margin-bottom: 20px;
            }
        }

        /* Navbar styling (if included) */
        .navbar {
            background-color: #e15a00; /* Orange background for navbar */
        }

        .navbar-brand {
            font-family: 'Noto Sans Thai', sans-serif;
            font-size: 1.8rem;
            color: #fff;
        }

        .nav-link {
            color: #fff;
        }

        .nav-link:hover {
            color: #ffd700; /* Hover effect color */
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <!-- Heading -->
    <h1 class="text-center">มุมคนเก่ง</h1>

    <!-- Image Gallery Section -->
    <div class="image-container">
        <!-- Image 1 -->
        <div class="image-frame">
            <img src="smart1.jpg" alt="Smart Image 1">
            <div class="image-label">รูปภาพที่ 1</div>
        </div>
        <!-- Image 2 -->
        <div class="image-frame">
            <img src="smart2.jpg" alt="Smart Image 2">
            <div class="image-label">รูปภาพที่ 2</div>
        </div>
        <!-- Image 3 -->
        <div class="image-frame">
            <img src="smart3.jpg" alt="Smart Image 3">
            <div class="image-label">รูปภาพที่ 3</div>
        </div>
        <!-- Image 4 -->
        <div class="image-frame">
            <img src="smart4.jpg" alt="Smart Image 4">
            <div class="image-label">รูปภาพที่ 4</div>
        </div>
        <!-- Image 5 -->
        <div class="image-frame">
            <img src="smart5.jpg" alt="Smart Image 5">
            <div class="image-label">รูปภาพที่ 5</div>
        </div>
        <!-- Image 6 -->
        <div class="image-frame">
            <img src="smart6.jpg" alt="Smart Image 6">
            <div class="image-label">รูปภาพที่ 6</div>
        </div>
    </div>

    <script>
        // Load Navbar from navbar.html
        fetch('navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Check current URL and set active class for corresponding link
                const navLinks = document.querySelectorAll('.nav-link');
                const currentPath = window.location.pathname.split('/').pop();

                navLinks.forEach(link => {
                    const linkPath = link.getAttribute('href');
                    if (linkPath === currentPath) {
                        link.classList.add('active'); // Add active class to the current link
                    } else {
                        link.classList.remove('active'); // Remove active class from other links
                    }
                });
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>
</body>

</html>
