    <!-- Custom styles for this template -->
    <link href="carousel.css" rel="stylesheet">

    <!-- Custom Font styles  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@100..900&family=Roboto:wght@100..900&display=swap"
        rel="stylesheet">
    
    <style>
        /* Custom Style for Images */
        .image-frame {
            border: 5px solid #ddd; /* Light gray border for the image frame */
            padding: 10px;
            margin: 10px;
            border-radius: 8px; /* Rounded corners for a smooth look */
            text-align: center;
        }
        
        .image-frame img {
            max-width: 100%; /* Ensure images scale with screen size */
            height: auto;
            border-radius: 8px;
        }
        
        .image-label {
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        
        .image-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <!-- Heading -->
    <h1 class="text-center">มุมคนเก่ง</h1>

    <!-- Image Gallery Section -->
    <div class="image-container">
        <!-- Image 1 -->
        <div class="image-frame">
            <img src="smart1.jpg" alt="Smart Image 1">
            <div class="image-label">รูปภาพที่ 1</div>
        </div>
        <!-- Image 2 -->
        <div class="image-frame">
            <img src="smart2.jpg" alt="Smart Image 2">
            <div class="image-label">รูปภาพที่ 2</div>
        </div>
        <!-- Image 3 -->
        <div class="image-frame">
            <img src="smart3.jpg" alt="Smart Image 3">
            <div class="image-label">รูปภาพที่ 3</div>
        </div>
        <!-- Image 4 -->
        <div class="image-frame">
            <img src="smart4.jpg" alt="Smart Image 4">
            <div class="image-label">รูปภาพที่ 4</div>
        </div>
        <!-- Image 5 -->
        <div class="image-frame">
            <img src="smart5.jpg" alt="Smart Image 5">
            <div class="image-label">รูปภาพที่ 5</div>
        </div>
        <!-- Image 6 -->
        <div class="image-frame">
            <img src="smart6.jpg" alt="Smart Image 6">
            <div class="image-label">รูปภาพที่ 6</div>
        </div>
    </div>

    <script>
        // Load Navbar from navbar.html
        fetch('navbar.html')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(data => {
                document.getElementById('navbar-placeholder').innerHTML = data;

                // Check current URL and set active class for corresponding link
                const navLinks = document.querySelectorAll('.nav-link');
                const currentPath = window.location.pathname.split('/').pop();

                navLinks.forEach(link => {
                    const linkPath = link.getAttribute('href');
                    if (linkPath === currentPath) {
                        link.classList.add('active'); // Add active class to the current link
                    } else {
                        link.classList.remove('active'); // Remove active class from other links
                    }
                });
            })
            .catch(error => console.error('Error loading navbar:', error));
    </script>
</body>
